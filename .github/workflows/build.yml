name: Build Radijator

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.pretty-name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            pretty-name: Linux
            artifact-name: radijator-linux
            cli-path: dist/radijator
            gui-path: dist/radijator-gui
          - os: windows-latest
            pretty-name: Windows
            artifact-name: radijator-windows
            cli-path: dist/radijator.exe
            gui-path: dist/radijator-gui.exe

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Checkout chirp dependency
      uses: actions/checkout@v6
      with:
        repository: kk7ds/chirp
        path: chirp-src

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt
        grep -v wxPython ./chirp-src/requirements.txt | pip install -r /dev/stdin
        pip install -e ./chirp-src

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt
        pip install -r ./chirp-src/requirements.txt
        pip install -e ./chirp-src

    - name: Build with PyInstaller
      run: |
        pyinstaller radijator.spec

    - name: Upload artifact
      uses: actions/upload-artifact@v6
      with:
        name: ${{ matrix.artifact-name }}
        path: |
          ${{ matrix.cli-path }}
          ${{ matrix.gui-path }}
        retention-days: 30
